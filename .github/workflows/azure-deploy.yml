# Disabled: this runs only when started by hand. See docs/08-deployment-azure.md.
# To enable it:
#   1. The App Service app exists (classify, in classify-rg). Turn on basic auth publishing
#      credentials so a publish profile can be downloaded (new apps have it off).
#   2. Add the publish profile as the AZURE_WEBAPP_PUBLISH_PROFILE repository secret.
#   3. Uncomment the push trigger.
name: Deploy to Azure App Service

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

env:
  AZURE_WEBAPP_NAME: classify
  PYTHON_VERSION: "3.12"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python scripts/validate_data.py
      - run: node --test tests/js/*.test.mjs
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
