{% extends "base.html" %}

{% block nav %}
  {# FR-34: shown only on narrow screens; mobile.js adds the tab panel roles there. #}
  <nav class="mobile-tabs" aria-label="Views">
    <div role="tablist">
      <button type="button" role="tab" id="tab-search" data-panel="search-panel" aria-controls="search-panel" aria-selected="true">Search</button>
      <button type="button" role="tab" id="tab-schedule" data-panel="calendar" aria-controls="calendar" aria-selected="false" tabindex="-1">
        My schedule<span id="schedule-badge-text" class="visually-hidden"></span>
        <span id="schedule-badge" class="tab-badge" aria-hidden="true" hidden></span>
      </button>
    </div>
  </nav>
{% endblock %}

{% block content %}
  <div id="search-panel" class="search-panel">
    <section class="panel" id="filters" aria-labelledby="filters-heading">
      <div class="filters-head">
        <h2 id="filters-heading">Filters</h2>
        <button type="button" id="filters-toggle" class="filters-toggle" aria-expanded="false" aria-controls="filters-body">Show filters</button>
      </div>
      <div id="filters-body" data-time-stops='{{ time_stops|tojson }}'></div>
    </section>

    <section class="panel" id="results" aria-labelledby="results-heading">
      <div class="results-top">
        <h2 id="results-heading">Results</h2>

        <div class="search-field">
          <label for="search-input">Search</label>
          <input
            type="search"
            id="search-input"
            name="q"
            placeholder="Subject, course number, or title"
            autocomplete="off"
          >
        </div>
        <p id="results-summary" class="results-summary" hidden></p>
      </div>

      <p id="results-message" class="status-message" role="status" aria-live="polite" hidden></p>

      <ul id="results-list" class="results-list" aria-labelledby="results-heading" hidden></ul>
      <div id="results-more" class="results-more"></div>
    </section>
  </div>

  <section class="panel" id="calendar" aria-labelledby="calendar-heading">
    <div class="schedule-head">
      <h2 id="calendar-heading" tabindex="-1">My schedule</h2>
      <span id="credit-total" class="credit-total" hidden></span>
      <a
        class="register-link"
        href="https://psb.is.tcu.edu/criteria.jsp"
        target="_blank"
        rel="noopener noreferrer"
      >Register on classes.tcu.edu ↗</a>
    </div>
    <div id="calendar-body"></div>
  </section>
{% endblock %}
