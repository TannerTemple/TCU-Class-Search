<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Classify{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body data-status-as-of="{{ status_as_of|default('') }}">
    <header class="site-header">
      <span class="brand">Classify</span>
      <span class="term">{{ term.name }}</span>
      <span class="data-as-of">
        Class data as of
        <time datetime="{{ term.scraped_at.isoformat() }}">{{ data_as_of }}</time>
      </span>
    </header>

    <main class="layout">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      Unofficial student project. Not affiliated with or endorsed by Texas Christian University.
    </footer>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
